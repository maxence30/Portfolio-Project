
<!DOCTYPE html>
<html lang="fr" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion</title>

    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="bg-base-200 min-h-screen">

    <header class="navbar bg-base-100 shadow-sm px-6">
        <a href="index.html" class="text-2xl font-bold text-primary">
            Accueil
        </a>
    </header>

    <main class="flex justify-center items-center min-h-[85vh] px-4">
        <div class="card bg-base-100 shadow-xl w-full max-w-md">
            <div class="card-body">

                <h1 class="text-3xl font-bold text-center">
                    Connexion
                </h1>

                <p class="text-center text-base-content/60 mb-4">
                    Connecte-toi pour accéder à ton espace.
                </p>

                <form id="loginForm" class="space-y-4">
                    <div>
                        <label for="email" class="label">
                            Adresse email
                        </label>
                        <input id="email" type="email"
                               class="input w-full" required>
                    </div>

                    <div>
                        <label for="password" class="label">
                            Mot de passe
                        </label>
                        <input id="password" type="password"
                               class="input w-full" required>
                    </div>

                    <button type="submit" class="btn btn-primary w-full">
                        Se connecter
                    </button>
                </form>

                <p id="message" role="status" aria-live="polite"
                   class="text-center mt-3"></p>

                <p class="text-center mt-4">
                    Pas encore de compte ?
                    <a href="register.html" class="link link-primary">
                        S'inscrire
                    </a>
                </p>

            </div>
        </div>
    </main>

    <script src="js/login.js"></script>
</body>
</html>
