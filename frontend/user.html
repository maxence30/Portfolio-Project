<!DOCTYPE html>
<html lang="fr" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profil public - Skillink</title>

    <link href="https://cdn.jsdelivr.net/npm/daisyui@5"
          rel="stylesheet" type="text/css">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="min-h-screen bg-base-200">

    <nav class="navbar bg-base-100 shadow-sm px-4 md:px-8">
        <div class="flex-1">
            <a href="index.html"
               class="text-2xl font-bold text-primary">
                Skillink
            </a>
        </div>

        <div class="flex flex-wrap gap-2 justify-end">
            <a href="projects.html" class="btn btn-ghost btn-sm">
                Projets
            </a>
            <a href="messages.html" class="btn btn-ghost btn-sm">
                Messagerie
            </a>
            <a href="profile.html" class="btn btn-outline btn-sm">
                Mon profil
            </a>
        </div>
    </nav>

    <main class="max-w-5xl mx-auto px-4 py-10">

        <a href="projects.html"
           class="link link-hover text-sm mb-6 inline-block">
            ← Retour aux projets
        </a>

        <p id="loading" class="text-center py-10">
            Chargement du profil...
        </p>

        <div id="errorMessage"
             class="hidden alert alert-error mb-5"></div>

        <div id="profileContent" class="hidden space-y-6">

            <section class="card bg-base-100 shadow-md">
                <div class="card-body">

                    <div class="flex items-center gap-4 mb-6">
                        <div id="avatarLetter"
                             class="w-20 h-20 rounded-full bg-primary
                                    text-primary-content flex items-center
                                    justify-center text-4xl font-bold">
                            ?
                        </div>

                        <div>
                            <h1 id="displayUsername"
                                class="text-3xl font-bold"></h1>
                            <p class="text-base-content/60">
                                Membre de Skillink
                            </p>
                        </div>
                    </div>

                    <h2 class="text-xl font-semibold mb-2">
                        Présentation
                    </h2>
                    <p id="displayDescription"
                       class="whitespace-pre-wrap mb-5"></p>

                    <h2 class="text-xl font-semibold mb-2">
                        Expérience
                    </h2>
                    <p id="displayExperience"
                       class="whitespace-pre-wrap mb-5"></p>

                    <h2 class="text-xl font-semibold mb-2">
                        Portfolio
                    </h2>
                    <div id="portfolioContainer"></div>

                </div>
            </section>

            <section class="card bg-base-100 shadow-md">
                <div class="card-body">
                    <h2 class="text-2xl font-bold mb-4">
                        Compétences
                    </h2>
                    <div id="skillsList"
                         class="flex flex-wrap gap-3"></div>
                </div>
            </section>

            <section>
                <h2 class="text-2xl font-bold mb-5">
                    Projets publiés
                </h2>

                <div id="projectsList"
                     class="grid grid-cols-1 md:grid-cols-2 gap-5">
                </div>
            </section>

        </div>
    </main>

    <script src="js/user.js"></script>
    <script src="js/navigation.js"></script>
</body>
</html>
